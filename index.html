<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Page Turner</title>
    <meta name="viewport" content="width=device-width"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="book bound">
  <div class="pages">
    <div class="page hero-page">
      <div class="hero-image-overlay">
        <img src="img/hero.jpg" alt="Hero" class="hero-image">
      </div>
      <div class="hero-sidebar">
        <div class="sidebar-item">Contenido 1</div>
        <div class="sidebar-item">Contenido 2</div>
        <div class="sidebar-item">Contenido 3</div>
        <div class="sidebar-item">Contenido 4</div>
      </div>
      <div class="hero-content">
        <div class="hero-title">Heloi Torre</div>
        <div class="hero-text">
          <div class="text-line">TU</div>
          <div class="text-line highlight">marca</div>
          <div class="text-line">MI</div>
          <div class="text-line">IMAGEN</div>
        </div>
        <div class="hero-subtitle">¿LISTO PARA<br>POTENCIAR TU MARCA?</div>
        <button class="hero-button">CONTACTAME</button>
      </div>
    </div>
    <div class="page video-page">
      <video autoplay muted loop playsinline preload="auto" class="split-video1">
        <source src="video/home/hero.mp4" type="video/mp4">
      </video>
    </div>
    <div class="page video-page">
      <video autoplay muted loop playsinline preload="auto" class="split-video2">
        <source src="video/home/hero.mp4" type="video/mp4">
      </video>
    </div>
    <div class="page"><!--colophon--></div>
    <div class="page"><!--title--></div>
    <div class="page">1<!--01--></div>
    <div class="page">2</div>
    <div class="page">3</div>
    <div class="page">4<!--04--></div>
    <div class="page">5<!--05--></div>
    <div class="page">6</div>
    <div class="page">7</div>
    <div class="page">8<!--08--></div>
    <div class="page">9</div>
    <div class="page">10<!--10--></div>
    <div class="page"><!--endpaper--></div>
    <div class="page"><!--endpaper--></div>
    <div class="page"><!--backcover--></div>
  </div>
</div>
